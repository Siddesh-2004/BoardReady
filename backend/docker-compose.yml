services:
  redis:
    image: redis:7-alpine
    container_name: leaderboard-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: leaderboard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: boardready
      POSTGRES_PASSWORD: boardready
      POSTGRES_DB: boardready
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data: